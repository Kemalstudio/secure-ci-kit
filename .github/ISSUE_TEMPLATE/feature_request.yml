name: Feature request
description: Suggest a new scanner, input or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A YAML example of the new input is very welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
